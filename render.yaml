# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo. All plans are free.
# Free Render Postgres expires after 30 days; to avoid that, create a free Neon (neon.tech)
# database and paste its URL into DATABASE_URL on c2c-api instead of using c2c-db.
databases:
  - name: c2c-db
    plan: free
    databaseName: c2c
    user: c2c

services:
  - type: web
    name: c2c-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free plan has no pre-deploy step, so migrate on start (alembic is idempotent).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase: { name: c2c-db, property: connectionString }
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AGENCY_EMAIL
        sync: false
      - key: CLIENT_EMAIL
        sync: false
      - key: SUB_A_EMAIL
        sync: false
      - key: SUB_B_EMAIL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.5-flash,gemini-flash-latest
      - key: APPROVAL_THRESHOLD
        value: "5000.00"
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        fromService: { type: web, name: c2c-web, property: host }

  - type: web
    name: c2c-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService: { type: web, name: c2c-api, property: host }
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
